[package]
name = "aftermath"
version = "0.1.0"
edition = "2024"

[dependencies]
# "dev" enables asset hot-reloading (file watcher); remove it for release builds.
bevy = { version = "0.20", features = ["dev"] }

# Bevy's recommended dev profile: dependencies stay optimized,
# our code stays fast to recompile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
